# Henter Google-anmeldelsene (kun 5 stjerner) til anmeldelser.json hver natt.
#
# Ingen nøkler: jobben identifiserer seg mot Google Cloud med GitHubs eget
# OIDC-token (Workload Identity Federation). Google-prosjektet
# «vestfold-bilsalg-2026» har en tjenestekonto som bare dette repoet får
# opptre som (satt opp 20. sep 2026 i Cloud Shell). Verdiene under er
# identifikatorer, ikke hemmeligheter.
name: Google-anmeldelser

on:
  schedule:
    - cron: '20 4 * * *'   # 04:20 UTC = 06:20 norsk sommertid
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  hent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/243646022144/locations/global/workloadIdentityPools/github/providers/github
          service_account: anmeldelser@vestfold-bilsalg-2026.iam.gserviceaccount.com
          token_format: access_token
      - name: Hent anmeldelser fra Google
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          GOOGLE_PROJECT: vestfold-bilsalg-2026
        run: node bin/hent-anmeldelser.mjs
      - name: Lagre hvis noe er nytt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- anmeldelser.json; then
            echo "Ingen endring."
          else
            git add anmeldelser.json
            git commit -m "Oppdaterte Google-anmeldelser"
            git push
            # GitHub Pages bygger ikke av seg selv etter push fra en jobb – be om bygg.
            gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
          fi
