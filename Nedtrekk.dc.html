<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/kepler-bilservice-design-system-333da542-97ee-40d5-8b4a-6eb405871274/tokens/colors.css">
  <link rel="stylesheet" href="_ds/kepler-bilservice-design-system-333da542-97ee-40d5-8b4a-6eb405871274/tokens/typography.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>body{margin:0}.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}</style>
</helmet>
<div ref="{{ rootRef }}" style="position:relative;width:100%">
  <button onClick="{{ toggle }}" style="display:flex;align-items:center;gap:8px;width:100%;min-height:46px;border:1px solid {{ borderColor }};border-radius:6px;padding:10px 12px;font-family:var(--font-body);font-size:15px;background:#fff;color:{{ labelColor }};cursor:pointer;text-align:left;box-sizing:border-box" style-focus="outline:2px solid var(--red-500);outline-offset:2px">
    <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ label }}</span>
    <span class="material-symbols-outlined" style="font-size:20px;color:var(--ink-400);flex:none">{{ chev }}</span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;{{ vert }}left:0;min-width:100%;background:#fff;border:1px solid var(--border-default);border-radius:8px;box-shadow:0 12px 32px rgba(22,23,27,.2);z-index:80;max-height:280px;overflow-y:auto;padding:4px;box-sizing:border-box">
      <sc-for list="{{ items }}" as="o" hint-placeholder-count="3">
        <button onClick="{{ o.pick }}" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:{{ o.bg }};border:none;border-radius:6px;padding:11px 12px;font-family:var(--font-body);font-size:15px;color:var(--ink-900);cursor:pointer;box-sizing:border-box" style-hover="background:var(--ink-050)">
          <span style="flex:1;min-width:0;overflow-wrap:anywhere">{{ o.l }}</span>
          <sc-if value="{{ o.sel }}" hint-placeholder-val="{{ false }}"><span class="material-symbols-outlined" style="font-size:18px;color:var(--red-600);flex:none">check</span></sc-if>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 280, &quot;height&quot;: 64}, &quot;options&quot;: {&quot;editor&quot;: null, &quot;default&quot;: [], &quot;tsType&quot;: &quot;Array&lt;string|{v:string,l:string}&gt;&quot;}, &quot;value&quot;: {&quot;editor&quot;: null, &quot;default&quot;: &quot;&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;onChange&quot;: {&quot;editor&quot;: null, &quot;default&quot;: null, &quot;tsType&quot;: &quot;(e:{target:{value:string}})=&gt;void&quot;}, &quot;placeholder&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Velg …&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, up: false };
  componentDidMount() {
    this._doc = e => { if (this.state.open && this.root && !this.root.contains(e.target)) this.setState({ open: false }); };
    document.addEventListener('mousedown', this._doc, true);
    this._esc = e => { if (e.key === 'Escape' && this.state.open) { e.stopPropagation(); this.setState({ open: false }); } };
    document.addEventListener('keydown', this._esc, true);
  }
  componentWillUnmount() { document.removeEventListener('mousedown', this._doc, true); document.removeEventListener('keydown', this._esc, true); }
  norm() { return (this.props.options || []).map(x => typeof x === 'string' ? { v: x, l: x } : { v: x.v, l: x.l }); }
  renderVals() {
    const val = this.props.value == null ? '' : this.props.value;
    const items = this.norm();
    const cur = items.find(i => String(i.v) === String(val) && String(i.v) !== '');
    return {
      rootRef: el => { this.root = el; },
      open: this.state.open,
      label: cur ? cur.l : (this.props.placeholder || 'Velg …'),
      labelColor: cur ? 'var(--ink-900)' : 'var(--ink-500)',
      borderColor: this.state.open ? 'var(--red-500)' : 'var(--border-default)',
      chev: this.state.open ? 'expand_less' : 'expand_more',
      vert: this.state.up ? 'bottom:calc(100% + 4px);' : 'top:calc(100% + 4px);',
      toggle: e => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setState({ open: !this.state.open, up: r.bottom > window.innerHeight - 300 });
      },
      items: items.map(i => ({
        l: i.l, sel: String(i.v) === String(val) && String(i.v) !== '',
        bg: String(i.v) === String(val) && String(i.v) !== '' ? 'var(--ink-050)' : 'transparent',
        pick: () => { this.setState({ open: false }); const f = this.props.onChange; if (f) f({ target: { value: i.v } }); },
      })),
    };
  }
}
</script>
</body>
</html>
